
name: Package CI

on:
  push:
    branches:
      - main
      - feature/package-credit-risk-framework
  pull_request:
    branches:
      - main

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build package
        run: python -m build

      - name: Install wheel
        run: python -m pip install dist/*.whl

      - name: Verify installed package
        run: |
          cd /tmp
          python -c "import credit_risk_framework; print(credit_risk_framework.__file__)"
          python -c "import credit_risk_framework.calibration"
          python -c "import credit_risk_framework.decisioning"
          python -c "import credit_risk_framework.drift"
          python -c "import credit_risk_framework.feature_engineering"
          python -c "import credit_risk_framework.metrics"
          python -c "import credit_risk_framework.modelling"
          python -c "import credit_risk_framework.plots"
          python -c "import credit_risk_framework.preprocessing"
          python -c "import credit_risk_framework.reporting"
          python -c "import credit_risk_framework.settings_dataset_mortgages"
          python -c "import credit_risk_framework.settings_dataset_unsecured"
          python -c "import credit_risk_framework.utils"
          python -c "import credit_risk_framework.validation"
